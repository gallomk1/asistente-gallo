plugins { id 'com.android.application' }
android {
    namespace 'ar.gallo.agenda'
    compileSdk 34
    defaultConfig {
        applicationId 'ar.gallo.agenda'
        minSdk 26
        targetSdk 33
        versionCode 15
        versionName "2.3"
    }
    def ksFile = rootProject.file('keystore.properties')
    def ks = new Properties()
    if (ksFile.exists()) ks.load(new FileInputStream(ksFile))
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
